name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Run go vet
        run: go vet ./...\

      - name: Run unit tests with race detector (Linux & macOS)
        if: runner.os != 'Windows'
        run: go test -v -race -coverprofile=coverage.txt ./...

      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        run: go test -v -coverprofile=coverage.txt ./...

      - name: Build binary
        run: go build -v ./cmd/dockpulse
