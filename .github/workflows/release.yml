name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Dockpulse
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: go.sum

      - name: Extract tag and version
        id: get_version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Run unit tests
        run: go test -v ./...

      - name: Create dist directory
        run: mkdir -p dist

      - name: Cross-compile Go binaries
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          TAG="${{ steps.get_version.outputs.tag }}"
          LDFLAGS="-s -w -X main.version=${TAG}"

          TARGETS=(
            "linux/amd64"
            "linux/arm64"
          )

          for TARGET in "${TARGETS[@]}"; do
            OS="${TARGET%%/*}"
            ARCH="${TARGET##*/}"
            OUT_DIR="bin/dockpulse_${TAG}_${OS}_${ARCH}"
            mkdir -p "${OUT_DIR}"
            echo "==> Building ${OS}/${ARCH}..."
            GOOS="${OS}" GOARCH="${ARCH}" go build -ldflags="${LDFLAGS}" -o "${OUT_DIR}/dockpulse" ./cmd/dockpulse

            ARCHIVE="dist/dockpulse_${TAG}_${OS}_${ARCH}.tar.gz"
            tar -czf "${ARCHIVE}" -C "${OUT_DIR}" dockpulse
            echo "Created ${ARCHIVE}"
          done

      - name: Build Debian packages (.deb)
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          PKG_VERSION="${VERSION}"

          for ARCH in amd64 arm64; do
            echo "==> Building .deb for ${ARCH}..."
            PKG_DIR="deb_pkg_${ARCH}"
            rm -rf "${PKG_DIR}"
            mkdir -p "${PKG_DIR}/DEBIAN"
            mkdir -p "${PKG_DIR}/usr/bin"

            cp "bin/dockpulse_${{ steps.get_version.outputs.tag }}_linux_${ARCH}/dockpulse" "${PKG_DIR}/usr/bin/"
            chmod 755 "${PKG_DIR}/usr/bin/dockpulse"

            {
              echo "Package: dockpulse"
              echo "Version: ${PKG_VERSION}"
              echo "Section: utils"
              echo "Priority: optional"
              echo "Architecture: ${ARCH}"
              echo "Maintainer: Andrey Vorobev <andrey.vorobev.aqa@gmail.com>"
              echo "Homepage: https://github.com/AndreyJVM/dockpulse"
              echo "Description: Fast System, Docker, Compose & Swarm terminal monitor"
              echo " A lightweight and fast terminal dashboard (TUI) written in Go to monitor"
              echo " host CPU, RAM, disk, network, Docker containers, Compose projects,"
              echo " and Swarm clusters."
            } > "${PKG_DIR}/DEBIAN/control"

            dpkg-deb --build --root-owner-group "${PKG_DIR}" "dist/dockpulse_${PKG_VERSION}_${ARCH}.deb"
            rm -rf "${PKG_DIR}"
          done

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Dockpulse ${{ steps.get_version.outputs.tag }}

            Сверхбыстрый интерактивный TUI-терминал мониторинга и управления Docker, Compose, Swarm и хост-системами с нулевыми внешними зависимостями.

            ### Что нового в ${{ steps.get_version.outputs.tag }}:
            - **Расширенная карточка деталей контейнера**: Отображение IP-адреса и имени пользовательской сети (Bridge/Overlay/Compose) с поддержкой прямого Unix-сокета и CLI фоллбэка.
            - **Статус аптайма и время создания**: Отображение времени непрерывной работы контейнера и точного времени создания/запуска (`Uptime / Started`).
            - **Политика перезапуска (Restart Policy)**: Определение и цветовая индикация политики перезапуска контейнера (`always`, `unless-stopped`, `on-failure`, `no`) в карточке деталей и окне инспекции.
            - **Эргономичное форматирование портов**: Автоматическая дедупликация IPv4 и IPv6 привязок портов (`0.0.0.0` и `[::]`) и наглядное стрелочное отображение маппинга (`0.0.0.0:8080 → 8080/tcp`).
            - **Отказоустойчивое определение IP в сетях Compose**: Надежное извлечение IP-адресов при инспекции контейнеров, подключенных к изолированным пользовательским сетям.

            ### Установка:

            #### Debian / Ubuntu / Linux Mint (.deb):
            ```bash
            # Для x86_64 / amd64:
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/dockpulse_${{ steps.get_version.outputs.version }}_amd64.deb
            sudo dpkg -i dockpulse_${{ steps.get_version.outputs.version }}_amd64.deb

            # Для ARM64 (Raspberry Pi, ARM-серверы):
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/dockpulse_${{ steps.get_version.outputs.version }}_arm64.deb
            sudo dpkg -i dockpulse_${{ steps.get_version.outputs.version }}_arm64.deb
            ```

            #### Прямой запуск автономного бинарника Linux:
            ```bash
            tar -xzf dockpulse_${{ steps.get_version.outputs.tag }}_linux_amd64.tar.gz
            ./dockpulse
            ```
          files: |
            dist/*
