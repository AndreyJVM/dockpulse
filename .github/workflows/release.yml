name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Run Go tests
        run: go test -v ./...

  build-and-release:
    name: Build and Release Binaries & Deb
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Extract version
        id: get_version
        run: |
          VERSION=$(cat VERSION)
          TAG_NAME=${GITHUB_REF_NAME:-v$VERSION}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Cross-compile Go binaries
        run: |
          mkdir -p dist bin
          VERSION="${{ steps.get_version.outputs.tag }}"
          LDFLAGS="-s -w -X main.version=${VERSION}"

          PLATFORMS=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64 .exe"
          )

          for PLATFORM in "${PLATFORMS[@]}"; do
            read -r GOOS GOARCH EXT <<< "$PLATFORM"
            BIN_NAME="system-monitor${EXT}"
            TARGET_DIR="system-monitor_${VERSION}_${GOOS}_${GOARCH}"
            
            echo "==> Building for ${GOOS}/${GOARCH}..."
            mkdir -p "bin/${TARGET_DIR}"
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -ldflags="${LDFLAGS}" -o "bin/${TARGET_DIR}/${BIN_NAME}" ./cmd/system-monitor

            cp README.md "bin/${TARGET_DIR}/" 2>/dev/null || true
            cp LICENSE "bin/${TARGET_DIR}/" 2>/dev/null || true

            cd bin
            if [ "${GOOS}" = "windows" ]; then
              zip -r "../dist/${TARGET_DIR}.zip" "${TARGET_DIR}"
            else
              tar -czvf "../dist/${TARGET_DIR}.tar.gz" "${TARGET_DIR}"
            fi
            cd ..
          done

      - name: Build Debian packages (.deb)
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          PKG_VERSION="${VERSION}"

          for ARCH in amd64 arm64; do
            echo "==> Building .deb for ${ARCH}..."
            PKG_DIR="deb_pkg_${ARCH}"
            rm -rf "${PKG_DIR}"
            mkdir -p "${PKG_DIR}/DEBIAN"
            mkdir -p "${PKG_DIR}/usr/bin"
            mkdir -p "${PKG_DIR}/usr/share/applications"
            mkdir -p "${PKG_DIR}/usr/share/icons/hicolor/128x128/apps"

            cp "bin/system-monitor_${{ steps.get_version.outputs.tag }}_linux_${ARCH}/system-monitor" "${PKG_DIR}/usr/bin/"
            chmod 755 "${PKG_DIR}/usr/bin/system-monitor"

            cp system-monitor.desktop "${PKG_DIR}/usr/share/applications/" 2>/dev/null || true
            cp icon.png "${PKG_DIR}/usr/share/icons/hicolor/128x128/apps/system-monitor.png" 2>/dev/null || true

            cat <<EOF > "${PKG_DIR}/DEBIAN/control"
Package: system-monitor
Version: ${PKG_VERSION}
Section: utils
Priority: optional
Architecture: ${ARCH}
Maintainer: Andrey Vorobev <andrey.vorobev.aqa@gmail.com>
Homepage: https://github.com/AndreyJVM/system-monitor
Description: Fast System, Docker, Compose & Swarm terminal monitor (Go Edition)
 A lightweight and fast terminal dashboard (TUI) written in Go to monitor
 host CPU, RAM, disk, network, Docker containers, Compose projects,
 and Swarm clusters.
EOF

            dpkg-deb --build --root-owner-group "${PKG_DIR}" "dist/system-monitor_${PKG_VERSION}_${ARCH}.deb"
            rm -rf "${PKG_DIR}"
          done

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## ⚡ System Monitor ${{ steps.get_version.outputs.tag }} (Go Edition)

            Полный переход проекта на **Go (Golang)**: сверхбыстрый интерактивный TUI-терминал с нулевыми зависимостями, молниеносным откликом (<2 мс) и кроссплатформенными бинарными файлами.

            ### ✨ Возможности:
            - 🖥️ **Хост-метрики в реальном времени**: ЦПУ (загрузка и ядра), RAM, дисковые разделы, сетевые IP/DNS и живая скорость сети (RX/TX).
            - 🐳 **Docker Daemon & Containers**: Прямой опрос unix-сокета (`/var/run/docker.sock`) без оверхеда и задержек, список запущенных и остановленных контейнеров, порты, статусы.
            - 📦 **Docker Compose Stacks**: Автоматическая группировка контейнеров в проекты Compose, подсчет сервисов и общий статус стека.
            - 🐝 **Docker Swarm Clusters**: Определение состояния ноды (Manager / Worker, Leader), топология кластера и реплицированные сервисы.
            - 🎨 **Современный TUI интерфейс**: Полноэкранный псевдографический дашборд на Charm Bubble Tea & Lip Gloss, цветные индикаторы, переключение вкладок `1-4`, обновление клавишей `r` или автоматический тик.
            - 🚀 **Одиночный автономный бинарник**: Никаких интерпретаторов, pip или зависимостей. Работает на любом дистрибутиве Linux, macOS и Windows.

            ### 📦 Установка:

            #### Debian / Ubuntu / Linux Mint (.deb):
            ```bash
            # Для x86_64 / amd64:
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/system-monitor_${{ steps.get_version.outputs.version }}_amd64.deb
            sudo dpkg -i system-monitor_${{ steps.get_version.outputs.version }}_amd64.deb

            # Для ARM64 (Raspberry Pi, ARM-серверы):
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/system-monitor_${{ steps.get_version.outputs.version }}_arm64.deb
            sudo dpkg -i system-monitor_${{ steps.get_version.outputs.version }}_arm64.deb
            ```

            #### Прямой запуск автономного бинарника (Linux / macOS):
            ```bash
            tar -xzf system-monitor_${{ steps.get_version.outputs.tag }}_linux_amd64.tar.gz
            ./system-monitor
            ```
          files: |
            dist/*
